[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-sessions"
version = "0.9.12"
description = "Unofficial tool for Claude Code sessions on disk: make a session visible under your other Claude account on the same machine, or move one between project folders. Command line or GUI. Journaled, reversible, fails closed."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Craig Stoller"}]
keywords = ["claude", "claude-code", "claude-desktop", "sessions", "session", "sync", "move", "cli", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/craigstoller/claude-code-sessions"
Issues = "https://github.com/craigstoller/claude-code-sessions/issues"
"Companion post" = "https://github.com/craigstoller/claude-code-sessions/blob/main/docs/the-session-that-synced-itself.md"

[project.scripts]
claude-code-sessions = "claude_code_sessions:main"
ccs = "claude_code_sessions:main"

# gui-scripts, not scripts: the launcher runs under pythonw, so double-clicking
# a shortcut never flashes a console window. A console-script entry point would.
[project.gui-scripts]
ccs-gui = "claude_code_sessions_gui:main"

[tool.setuptools]
py-modules = ["claude_code_sessions", "claude_code_sessions_gui"]
