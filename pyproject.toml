[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-sessions"
version = "0.1.0"
description = "Unofficial CLI for Claude Code sessions on disk: make a session visible under your other Claude account on the same machine, or move one between project folders. Journaled, reversible, fails closed."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
claude-code-sessions = "claude_code_sessions:main"
ccs = "claude_code_sessions:main"

[tool.setuptools]
py-modules = ["claude_code_sessions"]
