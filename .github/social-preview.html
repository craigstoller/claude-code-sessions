<!doctype html>
<!--
  Source for this repo's GitHub social preview image (Settings > General > Social preview).
  Re-render: capture this page at exactly 1280x640 (e.g. chrome --headless --screenshot=out.png --window-size=1280,640 file:///...), downscale to 1280x640 if the capture is DPR-scaled, keep under 1 MB, then upload manually - there is no API for social previews.
-->

<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1280px; height:640px; overflow:hidden; position:relative;
    background:#160d0a; font-family:"Segoe UI",system-ui,sans-serif; }
  .glow { position:absolute; right:-170px; top:-170px; width:820px; height:820px;
    background:radial-gradient(circle, rgba(217,119,87,.24) 0%, rgba(217,119,87,0) 62%); }
  .glow2 { position:absolute; left:-230px; bottom:-260px; width:700px; height:700px;
    background:radial-gradient(circle, rgba(217,119,87,.10) 0%, rgba(217,119,87,0) 60%); }
  .grid { position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:48px 48px; }
  .content { position:absolute; left:84px; top:128px; width:620px; }
  .owner { font-family:ui-monospace,Consolas,monospace; font-size:26px; color:#a98d80; letter-spacing:.5px; }
  h1 { font-family:ui-monospace,Consolas,monospace; font-size:57px; font-weight:700;
    color:#faf3ef; margin-top:10px; letter-spacing:-1px; line-height:1.1; }
  h1 .accent { color:#f29b78; }
  .tag { margin-top:24px; font-size:30px; line-height:1.45; color:#cdb4a7; font-weight:350; }
  .tag b { color:#f7e6dc; font-weight:600; }
  .chips { position:absolute; left:84px; bottom:70px; display:flex; gap:14px; }
  .chip { font-family:ui-monospace,Consolas,monospace; font-size:20px; color:#f0cebd;
    border:1px solid rgba(242,155,120,.45); border-radius:999px; padding:9px 22px;
    background:rgba(217,119,87,.10); }
  .art { position:absolute; right:84px; top:50%; transform:translateY(-50%); }
</style></head><body>
  <div class="glow"></div><div class="glow2"></div><div class="grid"></div>
  <div class="content">
    <div class="owner">craigstoller /</div>
    <h1>claude-code<br><span class="accent">-sessions</span></h1>
    <div class="tag">Move <b>Claude Code sessions</b> between accounts and project folders on the same machine.</div>
  </div>
  <div class="chips">
    <div class="chip">journaled</div><div class="chip">reversible</div><div class="chip">CLI + GUI</div>
  </div>

    <circle cx="172" cy="196" r="7" fill="#f29b78"/>
