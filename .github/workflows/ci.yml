name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    strategy:
      # Windows is the only platform where this tool's mutations are verified
      # at all - everywhere else the desktop-store routes refuse outright - so
      # a cancelled windows leg is the one result we cannot afford to lose.
      # With fail-fast on, an ubuntu-only failure cancelled both windows legs
      # and CI reported nothing about the platform that matters.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.12"]
        # ubuntu-latest is moving to Ubuntu 26.04, and setup-python has no 3.9
        # build for it, so the 3.9 leg stays on 24.04 while 3.9 is the floor in
        # pyproject.toml. Revisit when GitHub retires the 24.04 image.
        exclude:
          - {os: ubuntu-latest, python: "3.9"}
        include:
          - {os: ubuntu-24.04, python: "3.9"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install pytest
      - run: python -m pytest -q
